<form (ngSubmit)="onSubmit()" class="expense-form glass-panel">
  <h2>{{ editingId ? 'Edit Transaction' : 'Add New Transaction' }}</h2>

  <!-- Date -->
  <div class="form-group">
    <label for="date">Date</label>
    <input
      type="date"
      id="date"
      [(ngModel)]="formData.date"
      name="date"
      required
      class="form-control"
    />
    <small class="error" *ngIf="submitted && !formData.date">Date is required</small>
  </div>

  <!-- Description -->
  <div class="form-group">
    <label for="description">Description</label>
    <input
      type="text"
      id="description"
      [(ngModel)]="formData.description"
      name="description"
      placeholder="e.g., Grocery shopping, Gas, Salary"
      required
      class="form-control"
    />
    <small class="error" *ngIf="submitted && !formData.description">Description is required</small>
  </div>

  <!-- Amount -->
  <div class="form-group">
    <label for="amount">Amount ($)</label>
    <input
      type="number"
      id="amount"
      [(ngModel)]="formData.amount"
      name="amount"
      placeholder="0.00"
      min="0"
      step="0.01"
      required
      class="form-control"
    />
    <small class="error" *ngIf="submitted && formData.amount <= 0">Amount must be greater than 0</small>
  </div>

  <!-- Category -->
  <div class="form-group">
    <label for="category">Category</label>
    <select
      id="category"
      [(ngModel)]="formData.category"
      name="category"
      class="form-control"
    >
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
  </div>

  <!-- Type (Income/Expense) -->
  <div class="form-group">
    <label>Type</label>
    <div class="radio-group">
      <label>
        <input
          type="radio"
          [(ngModel)]="formData.type"
          name="type"
          value="expense"
        />
        Expense
      </label>
      <label>
        <input
          type="radio"
          [(ngModel)]="formData.type"
          name="type"
          value="income"
        />
        Income
      </label>
    </div>
  </div>

  <!-- Buttons -->
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">
      {{ editingId ? 'Update' : 'Add' }}
    </button>
    <button type="button" class="btn btn-secondary" (click)="resetForm()" *ngIf="editingId">
      Cancel
    </button>
  </div>
</form>
